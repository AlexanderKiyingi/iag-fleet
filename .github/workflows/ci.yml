name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iag
          POSTGRES_PASSWORD: iag_dev
          POSTGRES_DB: iag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iag -d iag_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Create service schema
        env:
          PGPASSWORD: iag_dev
        run: psql -h localhost -U iag -d iag_platform -c 'CREATE SCHEMA IF NOT EXISTS iag_fleet;'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Check out the SAME commit the Dockerfile pins, not main. Testing against
      # main meant a stale FLEET_IOT_REF was invisible here: the pin sat three
      # commits behind while CI stayed green, so the deployed image silently
      # lost fix-source tagging and the ingest authz hardening. Reading the ref
      # out of the Dockerfile keeps the two from drifting again.
      - name: Fetch Fleet_IoT (iag-telemetry-gateway) at the pinned ref
        run: |
          set -euo pipefail
          FLEET_IOT_REF="$(sed -n 's/^ARG FLEET_IOT_REF=//p' Dockerfile | head -1)"
          if [ -z "$FLEET_IOT_REF" ]; then
            echo "could not read ARG FLEET_IOT_REF from Dockerfile" >&2
            exit 1
          fi
          echo "Building against fleet-iot @ $FLEET_IOT_REF (pinned in Dockerfile)"
          git clone --filter=blob:none --no-checkout \
            https://github.com/AlexanderKiyingi/iag-telemetry-gateway.git /tmp/deps/Fleet_IoT
          git -C /tmp/deps/Fleet_IoT checkout "$FLEET_IOT_REF"
          go mod edit -replace=github.com/iag/fleet-iot=/tmp/deps/Fleet_IoT

      - name: Point platform-go replace at vendored third_party copy
        run: go mod edit -replace=github.com/alvor-technologies/iag-platform-go=$(pwd)/third_party/platform-go

      - name: go mod tidy
        run: go mod tidy

      - name: Build
        run: go build -v ./...
        env:
          DATABASE_URL: postgres://iag:iag_dev@localhost:5432/iag_platform?sslmode=disable&search_path=iag_fleet

      - name: Test
        run: go test ./...
        env:
          DATABASE_URL: postgres://iag:iag_dev@localhost:5432/iag_platform?sslmode=disable&search_path=iag_fleet

      - name: Integration tests
        run: go test ./internal/handlers/... -run Integration -v -count=1
        env:
          TEST_DATABASE_URL: postgres://iag:iag_dev@localhost:5432/iag_platform?sslmode=disable&search_path=iag_fleet
