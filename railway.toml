# Railway config-as-code for iag-fleet (repo root = service root).
# https://docs.railway.com/config-as-code/reference

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Final Dockerfile stage is `standalone` (clones Fleet_IoT). Monorepo Compose uses --target monorepo.

[deploy]
healthcheckPath = "/ready"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway probes the PORT variable (not ADDR). Keep PORT=4008 in service variables
# or rely on Dockerfile ENV PORT=4008 so healthchecks hit the API listener.

# Replica count lives here rather than in the dashboard, so the topology is
# reviewable and survives someone clicking in a hurry.
#
# Held at 1 deliberately. The code is ready for more — background jobs claim
# their work, realtime reaches every instance, and pools are bounded and
# pooler-safe — but two of those protections only engage once their
# infrastructure exists:
#
#   REDIS_URL   the gateway's rate-limit budget is per-process without it, so
#               N replicas serve N times the configured limit; contract
#               management's workspace pushes stay local to one instance.
#   PgBouncer   pools are sized per instance, so replicas multiply connections
#               against the one shared Postgres.
#
# Raise this only after both are in place, and raise the gateway with it.
numReplicas = 1
